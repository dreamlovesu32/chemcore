[package]
name = "chemsema-engine"
version = "1.0.0-beta.1"
description = "Shared Rust engine for ChemSema chemical documents, editing, rendering, and import/export."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
base64 = "0.22"
chemsema-chemical-graph = { path = "../chemsema-chemical-graph" }
chemsema-chemistry = { path = "../chemsema-chemistry" }
chemsema-inchi = { path = "../chemsema-inchi" }
encoding_rs = "0.8"
flate2 = "1.1"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff"] }
quick-xml = "0.39.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }

[build-dependencies]
flate2 = "1.1"
