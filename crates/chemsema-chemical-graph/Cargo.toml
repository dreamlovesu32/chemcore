[package]
name = "chemsema-chemical-graph"
version = "1.0.0-beta.1"
description = "Strict, presentation-independent ChemicalGraphV2 semantic model for ChemSema."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }

[[example]]
name = "write_schema"
path = "examples/write_schema.rs"

[[example]]
name = "write_nomenclature_schema"
path = "examples/write_nomenclature_schema.rs"
